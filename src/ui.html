<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta charset="utf-8">
<title>设备使用记录</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #f5f6f8;
  color: #1f2328;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 14px;
}
button, input, select { font-family: inherit; }
button { outline: none; }
.muted { color: #6b7280; }
.error { color: #b42318; font-size: 12px; min-height: 18px; margin-top: 8px; }
.hidden { display: none !important; }

/* 顶栏 */
.header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 22px; overflow: hidden; }
.header .title { float: left; font-size: 18px; font-weight: 600; line-height: 34px; }
.header .title .ver { font-size: 12px; font-weight: 400; color: #9ca3af; margin-left: 8px; }
.header .right { float: right; line-height: 34px; }
.pill {
  display: inline-block; padding: 5px 12px; border-radius: 999px;
  background: #eef2f7; color: #4b5563; font-size: 12px; margin-right: 10px;
  max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pill.active { background: #e8f0fe; color: #1a56db; }

/* 筛选 */
.filters { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 22px; }
.fgroup { display: inline-block; margin-right: 18px; }
.fgroup label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
select, .input {
  padding: 7px 10px; border: 1px solid #d0d7de; border-radius: 6px;
  background: #fff; color: #1f2328; font-size: 13px;
}
select { min-width: 120px; }
.input { width: 100%; }
select:focus, .input:focus { border-color: #1a56db; outline: none; }

/* 内容 */
.content { padding: 18px 22px 76px; }
.cards { overflow: hidden; margin-bottom: 14px; }
.card {
  float: left; width: 32.3%; margin-right: 1.5%;
  background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
  padding: 14px 16px; min-height: 78px;
}
.card.last { margin-right: 0; }
.card .label { font-size: 12px; color: #6b7280; }
.card .value { font-size: 22px; font-weight: 600; margin-top: 7px; }

.tabs { border-bottom: 1px solid #e5e7eb; margin-bottom: 12px; }
.tab {
  display: inline-block; padding: 9px 4px; margin-right: 22px; cursor: pointer;
  color: #6b7280; border-bottom: 2px solid transparent; font-size: 14px;
}
.tab.active { color: #1a56db; border-bottom-color: #1a56db; font-weight: 600; }

.grid {
  width: 100%; border-collapse: collapse; background: #fff;
  border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden;
}
.grid th {
  background: #f8fafc; text-align: left; font-size: 12px; font-weight: 500;
  color: #6b7280; padding: 9px 10px; border-bottom: 1px solid #e5e7eb;
  white-space: nowrap;
}
.grid td { padding: 9px 10px; border-bottom: 1px solid #f1f3f5; font-size: 13px; vertical-align: top; }
.grid tr:last-child td { border-bottom: none; }
.grid tbody tr:hover td { background: #f9fbff; }
.grid .empty { text-align: center; color: #9ca3af; padding: 26px 0; }
#sessionsBody td:nth-child(1), #sessionsBody td:nth-child(2), #sessionsBody td:nth-child(3),
#sessionsBody td:nth-child(4), #sessionsBody td:nth-child(5) { white-space: nowrap; }
#programsBody td:nth-child(2), #programsBody td:nth-child(3), #programsBody td:nth-child(4),
#programsBody td:nth-child(5), #programsBody td:nth-child(6) { white-space: nowrap; }
.path { color: #6b7280; font-size: 12px; word-break: break-all; }
.clickable { cursor: pointer; }

/* 按钮 */
.btn {
  display: inline-block; padding: 7px 14px; border: 1px solid #d0d7de;
  background: #fff; color: #1f2328; border-radius: 6px; cursor: pointer;
  font-size: 13px; line-height: 18px;
}
.btn:hover { background: #f6f8fa; }
.btn.primary { background: #1a56db; border-color: #1a56db; color: #fff; }
.btn.primary:hover { background: #1546b5; }
.btn.danger { color: #b42318; }
.btn.danger:hover { background: #fef3f2; }

/* 底部操作栏 */
.footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: #fff; border-top: 1px solid #e5e7eb; padding: 10px 22px; text-align: right;
}
.footer .left { float: left; }
.footer .btn { margin-left: 8px; }

/* 遮罩与登录 */
.overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(15, 23, 42, 0.55); display: none;
}
.overlay.show { display: block; }
.login-card {
  position: absolute; top: 50%; left: 50%; width: 360px; margin-left: -180px; margin-top: -150px;
  background: #fff; border-radius: 14px; padding: 28px;
  box-shadow: 0 12px 40px rgba(15, 23, 42, 0.28);
}
.brand { font-size: 20px; font-weight: 600; }
.login-sub { font-size: 13px; color: #6b7280; margin-top: 8px; }
.login-card .input { margin-top: 10px; }
.login-card .btn { width: 100%; margin-top: 14px; padding: 9px; }

/* 弹窗 */
.modal {
  position: absolute; top: 5%; left: 50%; width: 640px; margin-left: -320px;
  max-height: 88%; overflow: auto; background: #fff; border-radius: 12px;
  padding: 22px; box-shadow: 0 12px 40px rgba(15, 23, 42, 0.28);
}
.modal.small { width: 420px; margin-left: -210px; top: 30%; }
.modal.wide { width: 780px; margin-left: -390px; }
.settings-cols { overflow: hidden; margin-top: 4px; }
.settings-col { width: 48%; }
.settings-left { float: left; }
.settings-right { float: right; }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.section-title { font-size: 12px; color: #6b7280; font-weight: 600; margin: 18px 0 6px; }
.radio-line {
  display: block; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
  margin-top: 8px; cursor: pointer; font-size: 13px;
}
.radio-line:hover { background: #f9fafb; }
.radio-line input { margin-right: 8px; vertical-align: -2px; }
.checklist {
  max-height: 170px; overflow: auto; border: 1px solid #e5e7eb;
  border-radius: 8px; padding: 8px; margin-top: 8px;
}
.check-item { display: block; padding: 5px 4px; font-size: 13px; cursor: pointer; }
.check-item input { margin-right: 8px; vertical-align: -2px; }
.inline { margin-top: 8px; overflow: hidden; }
.inline .input { width: 78%; float: left; }
.inline .btn { float: right; width: 19%; }
.row { margin-top: 10px; overflow: hidden; }
.row label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.row .half { float: left; width: 48%; }
.row .half.right { float: right; }
.modal-actions { margin-top: 20px; text-align: right; }
.modal-actions .btn { margin-left: 8px; }
.tip { font-size: 12px; color: #9ca3af; margin-top: 6px; }

/* 提示 */
.toast {
  position: fixed; right: 22px; bottom: 70px; z-index: 80;
  background: #111827; color: #fff; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  max-width: 520px;
}
.toast.show { opacity: 1; }
.toast.error { background: #b42318; }
@media (max-width: 820px) {
  .card { width: 100%; margin-right: 0; margin-bottom: 10px; }
  .modal { width: 92%; margin-left: -46%; left: 50%; }
}
@media (max-width: 900px) {
  .modal.wide { width: 92%; margin-left: -46%; }
  .settings-col { width: 100%; float: none; }
}
</style>
</head>
<body>

<div id="login" class="overlay show">
  <div class="login-card">
    <div class="brand">设备使用记录</div>
    <div id="loginSub" class="login-sub">请输入管理口令</div>
    <input id="pwd" class="input" type="password" placeholder="口令">
    <input id="pwd2" class="input hidden" type="password" placeholder="再次输入口令">
    <div id="loginError" class="error"></div>
    <button id="loginBtn" class="btn primary" onclick="doLogin()">进入</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="title">设备使用记录<span id="ver" class="ver"></span></div>
    <div class="right">
      <span id="live" class="pill">当前：无摄像头占用</span>
      <button class="btn" onclick="reloadData()">刷新</button>
      <button class="btn" onclick="openSettings()">设置</button>
    </div>
  </div>

  <div class="filters">
    <span class="fgroup">
      <label>范围</label>
      <select id="rangeFilter" onchange="render()">
        <option value="today">今天</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
        <option value="all">全部</option>
      </select>
    </span>
    <span class="fgroup">
      <label>程序</label>
      <select id="appFilter" onchange="render()"></select>
    </span>
    <span class="fgroup">
      <label>设备</label>
      <select id="deviceFilter" onchange="render()"></select>
    </span>
  </div>

  <div class="content">
    <div class="cards">
      <div class="card">
        <div class="label">摄像头占用（并集）</div>
        <div id="statUnion" class="value">0 秒</div>
      </div>
      <div class="card">
        <div class="label">当前筛选</div>
        <div id="statCount" class="value">0 次</div>
      </div>
      <div class="card last">
        <div class="label">按程序累计</div>
        <div id="statTotal" class="value">0 秒</div>
      </div>
    </div>

    <div class="tabs">
      <span id="tabSessions" class="tab active" onclick="switchTab('sessions')">会话明细</span>
      <span id="tabPrograms" class="tab" onclick="switchTab('programs')">按程序汇总</span>
    </div>

    <div id="sessionsPane">
      <table class="grid">
        <thead>
          <tr>
            <th>日期</th><th>开始</th><th>结束</th><th>时长</th>
            <th>程序</th><th>设备</th><th>账户</th><th>路径</th>
          </tr>
        </thead>
        <tbody id="sessionsBody"></tbody>
      </table>
    </div>

    <div id="programsPane" class="hidden">
      <table class="grid">
        <thead>
          <tr>
            <th>程序</th><th>次数</th><th>总时长</th><th>平均每次</th><th>最长一次</th><th>最近一次</th>
          </tr>
        </thead>
        <tbody id="programsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <div class="left">
      <button class="btn" onclick="exportCsv()">导出 CSV</button>
      <button class="btn danger" onclick="askClear()">清理日志</button>
    </div>
    <button class="btn" onclick="closeMenu()">关闭</button>
    <button class="btn danger" onclick="askExit()">退出程序</button>
  </div>
</div>

<div id="settings" class="overlay">
  <div class="modal wide">
    <div class="modal-title">设置</div>
    <div class="settings-cols">
      <div class="settings-col settings-left">
        <div class="section-title">占用提示方式</div>
        <label class="radio-line"><input type="radio" name="displayMode" value="appbutton">在任务栏左侧新增一个应用图标</label>
        <label class="radio-line"><input type="radio" name="displayMode" value="tray">改变托盘图标（全程只保留一个托盘图标）</label>
        <label class="radio-line"><input type="radio" name="displayMode" value="overlay">在右上角常显传屏码浮层</label>

        <div class="section-title">占用提示显示条件（只影响提示，不影响日志）</div>
        <label class="radio-line"><input type="radio" name="taskbarMode" value="any">任何应用占用摄像头都提示</label>
        <label class="radio-line"><input type="radio" name="taskbarMode" value="only">仅名单内应用占用时提示</label>
        <label class="radio-line"><input type="radio" name="taskbarMode" value="exclude">忽略名单内应用的占用（其他应用照常提示）</label>
        <div class="tip">显示条件的名单与日志无关；被忽略的应用仍会完整记录。</div>
      </div>
      <div class="settings-col settings-right">
        <div class="section-title">名单（可执行文件名或 UWP 包族名）</div>
        <div id="appList" class="checklist"></div>
        <div class="inline">
          <input id="manualApp" class="input" type="text" placeholder="手动添加，例如 WeChat.exe">
          <button class="btn" onclick="addManualApp()">添加</button>
        </div>

        <div class="section-title">日志与安全</div>
        <div class="row">
          <div class="half">
            <label>日志保留天数</label>
            <input id="retention" class="input" type="number" min="1" max="3650">
          </div>
        </div>
        <div class="row">
          <div class="half">
            <label>当前口令</label>
            <input id="curPwd" class="input" type="password" placeholder="修改口令时填写">
          </div>
          <div class="half right">
            <label>新口令（至少 4 位）</label>
            <input id="newPwd" class="input" type="password">
          </div>
        </div>
        <div class="row">
          <div class="half">
            <label>再次输入新口令</label>
            <input id="newPwd2" class="input" type="password">
          </div>
        </div>
      </div>
    </div>
    <div id="settingsError" class="error"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div id="confirm" class="overlay">
  <div class="modal small">
    <div id="confirmText" class="modal-title">确定执行此操作？</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeConfirm()">取消</button>
      <button id="confirmOk" class="btn primary danger">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var nowMs = new Date().getTime();
var MOCK = {
  version: "0.2.0.0",
  hasPassword: true,
  disguiseName: "Realtek 高清晰音频管理器",
  user: "CLASS01\\student",
  config: { displayMode: "tray", taskbarMode: "any", taskbarApps: [], retentionDays: 90, overlayText: "" },
  devices: ["Integrated Camera"],
  active: [],
  sessions: [
    { startMs: nowMs - 3600000, endMs: nowMs - 3000000, app: "微信", identity: "WeChat.exe", path: "C:\\Program Files\\Tencent\\WeChat\\WeChat.exe", device: "Integrated Camera", user: "CLASS01\\student", seconds: 600, note: "" },
    { startMs: nowMs - 7200000, endMs: nowMs - 6600000, app: "钉钉", identity: "DingTalk.exe", path: "C:\\Program Files\\DingTalk\\DingTalk.exe", device: "Integrated Camera", user: "CLASS01\\student", seconds: 600, note: "" },
    { startMs: nowMs - 90000000, endMs: nowMs - 89900000, app: "相机", identity: "Microsoft.WindowsCamera_8wekyb3d8bbwe", path: "", device: "Integrated Camera", user: "CLASS01\\student", seconds: 100, note: "" }
  ]
};

var MOCK_API = {
  GetBootstrap: function () { return JSON.stringify(MOCK); },
  GetLive: function () {
    return JSON.stringify({ active: [{ app: "微信", identity: "WeChat.exe", device: "Integrated Camera", seconds: 83 }] });
  },
  SaveSettings: function (json) { return "ok"; },
  VerifyPassword: function (pwd) { return pwd ? "ok" : "bad"; },
  SetPassword: function (cur, next) { return "ok"; },
  ExportCsv: function (filter) { return "cancel"; },
  ClearLogs: function () { return "ok"; },
  CloseMenu: function () {},
  ExitApp: function () {}
};

var hasBridge = false;
try { hasBridge = !!(window.external && window.external.GetBootstrap); } catch (e) { hasBridge = false; }
var isIE = /Trident\/|MSIE /.test(navigator.userAgent);
var useMock = !hasBridge && !isIE;
var api = useMock ? MOCK_API : window.external;
var boot = null;
var config = null;
var allSessions = [];
var devices = [];
var programList = [];
var hasPassword = true;
var liveTimer = null;
var confirmAction = null;

function byId(id) { return document.getElementById(id); }
function hasClass(el, name) { return (" " + el.className + " ").indexOf(" " + name + " ") >= 0; }
function addClass(el, name) { if (!hasClass(el, name)) el.className = (el.className + " " + name).replace(/^\s+|\s+$/g, ""); }
function removeClass(el, name) { el.className = (" " + el.className + " ").replace(" " + name + " ", " ").replace(/^\s+|\s+$/g, ""); }
function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function formatDate(ms) {
  var d = new Date(ms);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function formatTime(ms) {
  var d = new Date(ms);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function formatDateTime(ms) { return formatDate(ms) + " " + formatTime(ms); }
function formatDuration(seconds) {
  seconds = Math.max(0, Number(seconds) || 0);
  if (seconds < 60) return Math.round(seconds) + " 秒";
  var minutes = Math.floor(seconds / 60);
  var hours = Math.floor(minutes / 60);
  var days = Math.floor(hours / 24);
  if (days > 0) return days + " 天 " + (hours % 24) + " 小时 " + (minutes % 60) + " 分";
  if (hours > 0) return hours + " 小时 " + (minutes % 60) + " 分";
  return minutes + " 分钟";
}

function doLogin() {
  var p1 = byId("pwd").value;
  var p2 = byId("pwd2").value;
  var err = byId("loginError");
  err.innerHTML = "";
  if (!hasPassword) {
    if (p1.length < 4) { err.innerHTML = "口令至少 4 位"; return; }
    if (p1 !== p2) { err.innerHTML = "两次输入不一致"; return; }
    var r = api.SetPassword("", p1);
    if (r !== "ok") { err.innerHTML = escapeHtml(r); return; }
    hasPassword = true;
    enterApp();
  } else {
    if (!p1) { err.innerHTML = "请输入口令"; return; }
    var result = api.VerifyPassword(p1);
    if (result === "ok") enterApp();
    else err.innerHTML = "口令不正确";
  }
}

function enterApp() {
  byId("login").className = "overlay";
  byId("app").className = "";
  reloadData();
  updateLive();
  if (!liveTimer) liveTimer = setInterval(updateLive, 5000);
}

function reloadData() {
  try {
    boot = JSON.parse(api.GetBootstrap());
  } catch (e) {
    showToast("读取数据失败", true);
    return;
  }
  config = boot.config || {};
  allSessions = boot.sessions || [];
  devices = boot.devices || [];
  hasPassword = !!boot.hasPassword;
  byId("ver").innerHTML = "v" + escapeHtml(boot.version || "");
  buildAppOptions();
  buildDeviceOptions();
  render();
}

function buildAppOptions() {
  var selected = byId("appFilter").value;
  var map = {};
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.identity) map[s.identity] = s.app || s.identity;
  }
  var manual = config.taskbarApps || [];
  for (i = 0; i < manual.length; i++) {
    if (!map[manual[i]]) map[manual[i]] = manual[i];
  }
  var identities = [];
  for (var key in map) {
    if (Object.prototype.hasOwnProperty.call(map, key)) identities.push(key);
  }
  identities.sort(function (a, b) { return (map[a] + a).localeCompare(map[b] + b); });

  var select = byId("appFilter");
  select.options.length = 0;
  select.options[0] = new Option("全部程序", "");
  for (i = 0; i < identities.length; i++) {
    select.options[select.options.length] = new Option(map[identities[i]] + " (" + identities[i] + ")", identities[i]);
  }
  select.value = selected && map[selected] ? selected : "";
}

function buildDeviceOptions() {
  var selected = byId("deviceFilter").value;
  var names = [];
  var i, j;
  for (i = 0; i < devices.length; i++) {
    var ok = true;
    for (j = 0; j < names.length; j++) if (names[j] === devices[i]) ok = false;
    if (ok && devices[i]) names.push(devices[i]);
  }
  names.sort();
  var select = byId("deviceFilter");
  select.options.length = 0;
  select.options[0] = new Option("全部设备", "");
  for (i = 0; i < names.length; i++) select.options[select.options.length] = new Option(names[i], names[i]);
  select.value = selected && names.indexOf(selected) >= 0 ? selected : "";
}

function rangeStart() {
  var value = byId("rangeFilter").value;
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  if (value === "today") return d.getTime();
  if (value === "7") return d.getTime() - 6 * 86400000;
  if (value === "30") return d.getTime() - 29 * 86400000;
  return 0;
}

function render() {
  var from = rangeStart();
  var appId = byId("appFilter").value;
  var device = byId("deviceFilter").value;
  var base = [];
  var filtered = [];
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.startMs < from) continue;
    if (device && s.device !== device) continue;
    base.push(s);
    if (!appId || s.identity === appId) filtered.push(s);
  }
  var total = 0;
  for (i = 0; i < filtered.length; i++) total += Number(filtered[i].seconds) || 0;
  byId("statUnion").innerHTML = formatDuration(unionSeconds(base));
  byId("statCount").innerHTML = filtered.length + " 次";
  byId("statTotal").innerHTML = formatDuration(total);
  renderSessions(filtered);
  renderPrograms(base);
}

function unionSeconds(list) {
  if (!list.length) return 0;
  var copy = list.slice(0);
  copy.sort(function (a, b) { return a.startMs - b.startMs; });
  var total = 0;
  var curStart = 0, curEnd = 0, started = false;
  for (var i = 0; i < copy.length; i++) {
    var s = copy[i].startMs;
    var e = copy[i].endMs ? copy[i].endMs : s + (Number(copy[i].seconds) || 0) * 1000;
    if (e < s) e = s;
    if (!started) { curStart = s; curEnd = e; started = true; }
    else if (s <= curEnd) { if (e > curEnd) curEnd = e; }
    else { total += (curEnd - curStart); curStart = s; curEnd = e; }
  }
  if (started) total += (curEnd - curStart);
  return Math.round(total / 1000);
}

function renderSessions(list) {
  var body = byId("sessionsBody");
  if (!list.length) {
    body.innerHTML = '<tr><td class="empty" colspan="8">当前筛选下没有记录</td></tr>';
    return;
  }
  var copy = list.slice(0);
  copy.sort(function (a, b) { return b.startMs - a.startMs; });
  var html = [];
  for (var i = 0; i < copy.length; i++) {
    var s = copy[i];
    html.push("<tr>");
    html.push("<td>" + formatDate(s.startMs) + "</td>");
    html.push("<td>" + formatTime(s.startMs) + "</td>");
    html.push("<td>" + (s.endMs ? formatTime(s.endMs) : "") + "</td>");
    html.push("<td>" + formatDuration(s.seconds) + "</td>");
    html.push("<td>" + escapeHtml(s.app) + "</td>");
    html.push("<td>" + escapeHtml(s.device) + "</td>");
    html.push("<td>" + escapeHtml(s.user) + "</td>");
    html.push('<td class="path">' + escapeHtml(s.path) + "</td>");
    html.push("</tr>");
  }
  body.innerHTML = html.join("");
}

function renderPrograms(list) {
  var map = {};
  var i;
  for (i = 0; i < list.length; i++) {
    var s = list[i];
    var key = s.identity || "未知";
    if (!map[key]) map[key] = { identity: key, display: s.app || key, count: 0, total: 0, max: 0, last: 0 };
    var item = map[key];
    item.display = s.app || item.display;
    item.count++;
    item.total += Number(s.seconds) || 0;
    if (Number(s.seconds) > item.max) item.max = Number(s.seconds);
    if (s.startMs > item.last) item.last = s.startMs;
  }
  programList = [];
  for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) programList.push(map[k]);
  programList.sort(function (a, b) { return b.total - a.total; });

  var body = byId("programsBody");
  if (!programList.length) {
    body.innerHTML = '<tr><td class="empty" colspan="6">当前筛选下没有记录</td></tr>';
    return;
  }
  var html = [];
  for (i = 0; i < programList.length; i++) {
    var p = programList[i];
    html.push('<tr class="clickable" onclick="setAppByIndex(' + i + ')">');
    html.push("<td>" + escapeHtml(p.display) + " (" + escapeHtml(p.identity) + ")</td>");
    html.push("<td>" + p.count + "</td>");
    html.push("<td>" + formatDuration(p.total) + "</td>");
    html.push("<td>" + formatDuration(p.count ? p.total / p.count : 0) + "</td>");
    html.push("<td>" + formatDuration(p.max) + "</td>");
    html.push("<td>" + formatDateTime(p.last) + "</td>");
    html.push("</tr>");
  }
  body.innerHTML = html.join("");
}

function setAppByIndex(index) {
  if (!programList[index]) return;
  var select = byId("appFilter");
  select.value = programList[index].identity;
  if (select.value !== programList[index].identity) {
    select.options[select.options.length] = new Option(programList[index].display + " (" + programList[index].identity + ")", programList[index].identity);
    select.value = programList[index].identity;
  }
  render();
}

function switchTab(name) {
  var sessions = name === "sessions";
  byId("sessionsPane").className = sessions ? "" : "hidden";
  byId("programsPane").className = sessions ? "hidden" : "";
  byId("tabSessions").className = sessions ? "tab active" : "tab";
  byId("tabPrograms").className = sessions ? "tab" : "tab active";
}

function updateLive() {
  try {
    var live = JSON.parse(api.GetLive());
    var el = byId("live");
    var active = live.active || [];
    if (!active.length) {
      el.innerHTML = "当前：无摄像头占用";
      el.className = "pill";
      return;
    }
    var parts = [];
    for (var i = 0; i < active.length; i++) {
      parts.push(escapeHtml(active[i].app) + "（已用 " + formatDuration(active[i].seconds) + "）");
    }
    el.innerHTML = "当前：" + parts.join("；");
    el.className = "pill active";
  } catch (e) {}
}

function showToast(message, isError) {
  var toast = byId("toast");
  toast.innerHTML = escapeHtml(message);
  toast.className = isError ? "toast show error" : "toast show";
  window.setTimeout(function () { toast.className = "toast"; }, 2600);
}

function openSettings() {
  if (!boot) return;
  var display = config.displayMode || "tray";
  var mode = config.taskbarMode || "any";
  setRadio("displayMode", display);
  setRadio("taskbarMode", mode);
  byId("retention").value = config.retentionDays || 90;
  byId("curPwd").value = "";
  byId("newPwd").value = "";
  byId("newPwd2").value = "";
  byId("settingsError").innerHTML = "";
  buildSettingsAppList();
  byId("settings").className = "overlay show";
}

function setRadio(name, value) {
  var inputs = document.getElementsByName(name);
  for (var i = 0; i < inputs.length; i++) inputs[i].checked = inputs[i].value === value;
}

function getRadio(name) {
  var inputs = document.getElementsByName(name);
  for (var i = 0; i < inputs.length; i++) if (inputs[i].checked) return inputs[i].value;
  return "";
}

function buildSettingsAppList() {
  var map = {};
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.identity) map[s.identity] = s.app || s.identity;
  }
  var apps = config.taskbarApps || [];
  for (i = 0; i < apps.length; i++) if (!map[apps[i]]) map[apps[i]] = apps[i];
  var keys = [];
  for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) keys.push(k);
  keys.sort(function (a, b) { return (map[a] + a).localeCompare(map[b] + b); });
  var html = [];
  if (!keys.length) html.push('<div class="tip">还没有检测到应用，可手动添加。</div>');
  for (i = 0; i < keys.length; i++) {
    var checked = false;
    for (var j = 0; j < apps.length; j++) if (apps[j] === keys[i]) checked = true;
    html.push('<label class="check-item"><input type="checkbox" value="' + escapeHtml(keys[i]) + '"' + (checked ? " checked" : "") + "> " + escapeHtml(map[keys[i]]) + " (" + escapeHtml(keys[i]) + ")</label>");
  }
  byId("appList").innerHTML = html.join("");
}

function addManualApp() {
  var input = byId("manualApp");
  var value = input.value.replace(/^\s+|\s+$/g, "");
  if (!value) return;
  var list = byId("appList");
  var inputs = list.getElementsByTagName("input");
  for (var i = 0; i < inputs.length; i++) {
    if (inputs[i].value === value) { inputs[i].checked = true; input.value = ""; return; }
  }
  var label = document.createElement("label");
  label.className = "check-item";
  var checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = value;
  checkbox.checked = true;
  label.appendChild(checkbox);
  label.appendChild(document.createTextNode(" " + value));
  list.appendChild(label);
  input.value = "";
}

function saveSettings() {
  var err = byId("settingsError");
  err.innerHTML = "";
  var retention = parseInt(byId("retention").value, 10);
  if (!(retention >= 1 && retention <= 3650)) { err.innerHTML = "日志保留天数需在 1–3650 之间"; return; }
  var apps = [];
  var inputs = byId("appList").getElementsByTagName("input");
  for (var i = 0; i < inputs.length; i++) {
    if (inputs[i].checked && inputs[i].value) apps.push(inputs[i].value);
  }
  var cfg = {
    displayMode: getRadio("displayMode"),
    taskbarMode: getRadio("taskbarMode"),
    taskbarApps: apps,
    retentionDays: retention,
    overlayText: config.overlayText || ""
  };
  var result = api.SaveSettings(JSON.stringify(cfg));
  if (result !== "ok") { err.innerHTML = escapeHtml(result || "保存失败"); return; }

  var cur = byId("curPwd").value;
  var next = byId("newPwd").value;
  var next2 = byId("newPwd2").value;
  if (cur || next || next2) {
    if (next.length < 4) { err.innerHTML = "新口令至少 4 位"; return; }
    if (next !== next2) { err.innerHTML = "两次输入不一致"; return; }
    var pwdResult = api.SetPassword(cur, next);
    if (pwdResult !== "ok") { err.innerHTML = escapeHtml(pwdResult); return; }
    hasPassword = true;
  }
  reloadData();
  closeSettings();
  showToast("设置已保存");
}

function closeSettings() { byId("settings").className = "overlay"; }

function exportCsv() {
  var filter = {
    fromMs: rangeStart(),
    toMs: 0,
    app: byId("appFilter").value,
    device: byId("deviceFilter").value
  };
  var result = api.ExportCsv(JSON.stringify(filter));
  if (result && result.indexOf("ok|") === 0) showToast("已导出：" + result.substring(3));
  else if (result !== "cancel") showToast(result || "导出失败", true);
}

function askClear() {
  showConfirm("确定清空全部使用日志？此操作不可恢复。", function () {
    var result = api.ClearLogs();
    if (result === "ok") { reloadData(); showToast("日志已清空"); }
    else showToast(result || "清理失败", true);
  });
}

function askExit() {
  showConfirm("确定退出监控程序？退出后将不再记录摄像头占用。", function () {
    api.ExitApp();
  });
}

function showConfirm(text, action) {
  byId("confirmText").innerHTML = text;
  byId("confirmOk").onclick = function () { closeConfirm(); action(); };
  byId("confirm").className = "overlay show";
}

function closeConfirm() { byId("confirm").className = "overlay"; }

function closeMenu() { api.CloseMenu(); }

function init() {
  try {
    boot = JSON.parse(api.GetBootstrap());
  } catch (e) {
    byId("loginError").innerHTML = "读取数据失败，请关闭后重试";
    return;
  }
  config = boot.config || {};
  allSessions = boot.sessions || [];
  devices = boot.devices || [];
  hasPassword = !!boot.hasPassword;
  byId("ver").innerHTML = "v" + escapeHtml(boot.version || "");
  if (!hasPassword) {
    byId("loginSub").innerHTML = "首次使用，请设置管理口令";
    byId("pwd2").className = "input";
    byId("loginBtn").innerHTML = "设置并进入";
  } else {
    byId("loginSub").innerHTML = "请输入管理口令";
    byId("pwd2").className = "input hidden";
  }
  if (useMock) enterApp();
}

window.onload = init;
document.onkeydown = function (e) {
  e = e || window.event;
  if (e.keyCode === 13) {
    var target = e.target || e.srcElement;
    if (target && target.id === "pwd") doLogin();
  }
};
</script>
</body>
</html>
