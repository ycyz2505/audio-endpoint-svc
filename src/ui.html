<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta charset="utf-8">
<title>设备使用记录</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #F2F3F0;
  color: #161B18;
  font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
}
button, input, select { font-family: inherit; }
button { outline: none; }
.hidden { display: none !important; }

/* 品牌标记：三根电平条 */
.mark { display: inline-block; width: 26px; height: 26px; position: relative; vertical-align: middle; }
.mark i { position: absolute; bottom: 0; width: 4px; background: #1F5F53; }
.mark i:nth-child(1) { left: 0; height: 10px; }
.mark i:nth-child(2) { left: 8px; height: 17px; }
.mark i:nth-child(3) { left: 16px; height: 24px; }

/* 顶栏 */
.masthead { background: #FFFFFF; border-bottom: 1px solid #DCE0DA; padding: 15px 32px; overflow: hidden; }
.brand { float: left; }
.brand-text { display: inline-block; vertical-align: middle; }
.brand-title { font-size: 17px; font-weight: 600; letter-spacing: .5px; line-height: 1.3; }
.brand-sub { font-size: 11px; color: #6E766F; margin-top: 1px; }
.masthead-right { float: right; line-height: 34px; }
.version { font-size: 11px; color: #9AA19B; margin-right: 18px; }
.ghost { background: none; border: none; color: #6E766F; font-size: 13px; margin-left: 20px; cursor: pointer; padding: 0; }
.ghost:hover { color: #161B18; }

/* 实时占用带（唯一的强提示） */
.live-bar { background: #FFFFFF; border-bottom: 1px solid #DCE0DA; padding: 0 32px; height: 40px; line-height: 40px; font-size: 12px; color: #6E766F; transition: background-color .2s ease; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1px solid #9AA19B; margin-right: 10px; vertical-align: 1px; }
.live-text { font-size: 12px; }
.live-meta { float: right; color: #6E766F; }
.live-bar.active { background: #E8F0EC; }
.live-bar.active .live-dot { background: #A33B2A; border-color: #A33B2A; -webkit-animation: pulse 2s infinite; animation: pulse 2s infinite; }
.live-bar.active .live-text { color: #161B18; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .3; } 100% { opacity: 1; } }

/* 工具栏 */
.toolbar { padding: 12px 32px 13px; background: #F2F3F0; border-bottom: 1px solid #DCE0DA; overflow: hidden; }
.ranges { float: left; line-height: 30px; }
.range { background: none; border: none; border-bottom: 2px solid transparent; color: #6E766F; font-size: 13px; padding: 4px 0; margin-right: 24px; cursor: pointer; }
.range.active { color: #161B18; border-bottom-color: #1F5F53; }
.range:hover { color: #161B18; }
.toolbar-right { float: right; }
.select-wrap { display: inline-block; margin-left: 22px; vertical-align: top; }
.select-wrap label { display: block; font-size: 10px; color: #9AA19B; line-height: 1.2; margin-bottom: 2px; }
.select-wrap select { border: none; border-bottom: 1px solid #C9CEC7; background: transparent; color: #161B18; font-size: 13px; padding: 2px 18px 3px 0; min-width: 132px; }
.select-wrap select:focus { outline: none; border-bottom-color: #1F5F53; }

/* 数据带：不用卡片 */
.stats { background: #FFFFFF; border-bottom: 1px solid #DCE0DA; overflow: hidden; }
.stat { float: left; width: 33.33%; padding: 18px 32px 16px; border-left: 1px solid #E6E9E3; }
.stat.first { border-left: none; }
.stat-num { font-family: Georgia, "Times New Roman", serif; font-size: 36px; line-height: 1.05; color: #161B18; }
.stat-unit { font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; font-size: 12px; color: #6E766F; margin-left: 6px; }
.stat-label { margin-top: 5px; font-size: 11px; color: #6E766F; }

/* 标签页 */
.tabs { padding: 0 32px; background: #FFFFFF; border-bottom: 1px solid #DCE0DA; }
.tab { display: inline-block; padding: 13px 0; margin-right: 28px; font-size: 13px; color: #6E766F; border-bottom: 2px solid transparent; cursor: pointer; }
.tab.active { color: #161B18; border-bottom-color: #1F5F53; }

/* 表格 */
.table-area { padding: 0 32px 88px; background: #F2F3F0; }
.table-scroll { overflow-x: auto; }
.grid { width: 100%; border-collapse: collapse; background: transparent; }
.grid th { text-align: left; font-weight: 400; font-size: 11px; color: #9AA19B; padding: 12px 10px; border-bottom: 1px solid #DCE0DA; white-space: nowrap; }
.grid td { padding: 12px 10px; border-bottom: 1px solid #E7EAE4; font-size: 12.5px; color: #161B18; vertical-align: top; }
.grid tbody tr:hover td { background: #F7F8F5; }
.grid .num { text-align: right; }
.grid .empty { text-align: left; color: #9AA19B; padding: 24px 10px; }
.app-name { font-weight: 600; }
.identity { color: #9AA19B; font-size: 11px; }
.path { color: #6E766F; font-size: 11.5px; word-break: break-all; }
.clickable { cursor: pointer; }
#sessionsBody td:nth-child(1), #sessionsBody td:nth-child(2), #sessionsBody td:nth-child(3),
#sessionsBody td:nth-child(4), #sessionsBody td:nth-child(5) { white-space: nowrap; }
#programsBody td:nth-child(2), #programsBody td:nth-child(3), #programsBody td:nth-child(4),
#programsBody td:nth-child(5), #programsBody td:nth-child(6) { white-space: nowrap; }

/* 按钮 */
.btn { border: 1px solid #1F5F53; background: #1F5F53; color: #FFFFFF; padding: 8px 16px; font-size: 13px; cursor: pointer; border-radius: 2px; }
.btn:hover { background: #174A40; border-color: #174A40; }
.btn.outline { background: transparent; color: #161B18; border-color: #C9CEC7; }
.btn.outline:hover { border-color: #1F5F53; color: #1F5F53; }
.btn.danger { background: #A33B2A; border-color: #A33B2A; }
.btn.danger:hover { background: #8C3022; border-color: #8C3022; }
.btn-text { background: none; border: none; padding: 0; color: #6E766F; font-size: 12.5px; cursor: pointer; }
.btn-text:hover { color: #161B18; }
.btn-text.danger { color: #A33B2A; }

/* 底栏 */
.footer { position: fixed; left: 0; right: 0; bottom: 0; height: 54px; background: #F2F3F0; border-top: 1px solid #DCE0DA; padding: 0 32px; line-height: 54px; }
.footer .left { float: left; }
.footer .left .btn-text { margin-right: 24px; }
.footer .right { float: right; }
.footer .right .btn-text { margin-left: 24px; }

/* 登录分屏 */
.login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60; display: table; width: 100%; height: 100%; }
.login-left, .login-right { display: table-cell; vertical-align: middle; }
.login-left { width: 42%; background: #141A17; color: #F2F3F0; padding: 0 56px; }
.login-right { width: 58%; background: #F2F3F0; padding: 0 56px; }
.login-left .mark i { background: #3E8D7C; }
.login-brand { font-size: 24px; font-weight: 600; letter-spacing: 1px; margin-top: 26px; }
.login-tagline { font-size: 12px; color: #8E9790; line-height: 1.9; margin-top: 10px; }
.login-form { max-width: 320px; margin: 0 auto; }
.login-form .form-title { font-size: 16px; font-weight: 600; margin-bottom: 26px; }
.field { width: 100%; border: none; border-bottom: 1px solid #C9CEC7; background: transparent; color: #161B18; font-size: 14px; padding: 9px 0; border-radius: 0; }
.field:focus { outline: none; border-bottom-color: #1F5F53; }
.login-form .field { margin-bottom: 20px; }
.login-form .btn { width: 100%; padding: 10px; margin-top: 6px; }
.error { color: #A33B2A; font-size: 12px; min-height: 18px; margin: 6px 0; }

/* 设置抽屉 */
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(15, 22, 18, .45); display: none; }
.drawer-overlay.show { display: block; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 500px; background: #F2F3F0; border-left: 3px solid #1F5F53; box-shadow: -10px 0 30px rgba(10, 20, 15, .12); transform: translateX(100%); -ms-transform: translateX(100%); transition: transform .22s ease; }
.drawer-overlay.show .drawer { transform: translateX(0); -ms-transform: translateX(0); }
.drawer-head { position: absolute; top: 0; left: 0; right: 0; height: 64px; padding: 0 28px; line-height: 64px; border-bottom: 1px solid #DCE0DA; }
.drawer-title { font-size: 16px; font-weight: 600; float: left; }
.icon-btn { float: right; background: none; border: none; font-size: 22px; color: #6E766F; cursor: pointer; line-height: 64px; padding: 0; }
.drawer-body { position: absolute; top: 64px; bottom: 64px; left: 0; right: 0; overflow: auto; padding: 8px 28px 20px; }
.drawer-foot { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; padding: 15px 28px 0; line-height: 34px; border-top: 1px solid #DCE0DA; background: #F2F3F0; text-align: right; }
.drawer-foot .btn-text { margin-right: 18px; }
.drawer-error { float: left; max-width: 62%; color: #A33B2A; font-size: 11px; line-height: 16px; margin-top: 9px; }
.section { padding: 16px 0 4px; border-bottom: 1px solid #E1E5DF; }
.section:last-child { border-bottom: none; }
.section-title { font-size: 12px; font-weight: 600; color: #161B18; margin-bottom: 6px; }
.choice { display: block; position: relative; padding: 10px 0; border-bottom: 1px solid #E7EAE4; font-size: 12.5px; color: #161B18; cursor: pointer; }
.choice:last-child { border-bottom: none; }
.choice:hover { color: #1F5F53; }
.choice input, .check-item input { position: absolute; left: 0; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 0; opacity: 0; cursor: pointer; }
.ind { display: inline-block; width: 14px; height: 14px; border: 1px solid #9AA19B; border-radius: 50%; background: #fff; vertical-align: -2px; margin-right: 9px; position: relative; }
.check-item .ind { border-radius: 2px; }
input:checked + .ind { border-color: #1F5F53; }
input[type=radio]:checked + .ind:after { content: ""; position: absolute; left: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: #1F5F53; }
input[type=checkbox]:checked + .ind { background: #1F5F53; }
input[type=checkbox]:checked + .ind:after { content: ""; position: absolute; left: 4px; top: 0; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.5px 1.5px 0; -ms-transform: rotate(45deg); transform: rotate(45deg); }
input:focus + .ind { outline: 1px solid #1F5F53; outline-offset: 2px; }
.hint { font-size: 11px; color: #9AA19B; margin-top: 8px; line-height: 1.7; }
.checklist { max-height: 170px; overflow: auto; margin-top: 6px; }
.check-item { display: block; position: relative; padding: 7px 0; border-bottom: 1px solid #E7EAE4; font-size: 12px; color: #161B18; cursor: pointer; }
.check-item:last-child { border-bottom: none; }
.check-item:hover { color: #1F5F53; }
.inline { margin-top: 10px; overflow: hidden; }
.inline .field { float: left; width: 74%; }
.inline .btn { float: right; width: 23%; padding: 8px 0; }
.field-label { display: block; font-size: 11px; color: #9AA19B; margin: 14px 0 0; }
.field.short { width: 100px; }

/* 确认框 */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 70; background: rgba(15, 22, 18, .45); display: none; }
.overlay.show { display: block; }
.sheet { position: absolute; top: 50%; left: 50%; width: 400px; margin-left: -200px; margin-top: -90px; background: #FFFFFF; border-top: 3px solid #A33B2A; padding: 24px; box-shadow: 0 10px 30px rgba(10, 20, 15, .14); }
.sheet-title { font-size: 15px; font-weight: 600; line-height: 1.6; }
.sheet-actions { margin-top: 22px; text-align: right; }
.sheet-actions .btn-text { margin-right: 18px; }

/* 提示 */
.toast { position: fixed; left: 32px; bottom: 70px; z-index: 80; background: #161B18; color: #F2F3F0; padding: 9px 14px; font-size: 12px; opacity: 0; transition: opacity .18s ease; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.error { background: #A33B2A; }

@media (max-width: 780px) {
  .stat { width: 100%; float: none; border-left: none; border-top: 1px solid #E6E9E3; }
  .stat.first { border-top: none; }
  .toolbar-right { float: none; margin-top: 10px; }
  .ranges { float: none; }
  .select-wrap:first-child { margin-left: 0; }
  .login-screen { display: block; }
  .login-left { display: none; }
  .login-right { display: block; width: 100%; padding: 80px 32px; }
  .drawer { width: 92%; }
}

button:focus, select:focus, input:focus { outline: 1px solid #1F5F53; outline-offset: 2px; }
.field:focus { outline: none; }
@media (prefers-reduced-motion: reduce) {
  .live-dot { animation: none; -webkit-animation: none; }
  .drawer { transition: none; }
}
</style>
</head>
<body>

<div id="login" class="login-screen">
  <div class="login-left">
    <span class="mark"><i></i><i></i><i></i></span>
    <div class="login-brand">设备使用记录</div>
    <div class="login-tagline">本地设备使用日志<br>数据只保存在这台电脑</div>
  </div>
  <div class="login-right">
    <div class="login-form">
      <div id="loginSub" class="form-title">请输入管理口令</div>
      <input id="pwd" class="field" type="password" placeholder="口令">
      <input id="pwd2" class="field hidden" type="password" placeholder="再次输入口令">
      <div id="loginError" class="error"></div>
      <button id="loginBtn" class="btn" onclick="doLogin()">进入</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="masthead">
    <div class="brand">
      <span class="mark"><i></i><i></i><i></i></span>
      <div class="brand-text">
        <div class="brand-title">设备使用记录</div>
        <div class="brand-sub">本地设备使用日志</div>
      </div>
    </div>
    <div class="masthead-right">
      <span id="ver" class="version"></span>
      <button class="ghost" onclick="openSettings()">设置</button>
    </div>
  </div>

  <div id="live" class="live-bar">
    <span class="live-dot"></span>
    <span id="liveText" class="live-text">当前没有摄像头占用</span>
    <span id="liveMeta" class="live-meta"></span>
  </div>

  <div class="toolbar">
    <div id="rangeGroup" class="ranges">
      <button type="button" class="range active" onclick="setRange('today', this)">今天</button>
      <button type="button" class="range" onclick="setRange('7', this)">近 7 天</button>
      <button type="button" class="range" onclick="setRange('30', this)">近 30 天</button>
      <button type="button" class="range" onclick="setRange('all', this)">全部</button>
    </div>
    <div class="toolbar-right">
      <span class="select-wrap">
        <label>程序</label>
        <select id="appFilter" onchange="render()"></select>
      </span>
      <span class="select-wrap">
        <label>设备</label>
        <select id="deviceFilter" onchange="render()"></select>
      </span>
    </div>
  </div>

  <div class="stats">
    <div class="stat first">
      <div id="statUnion" class="stat-value"></div>
      <div class="stat-label">摄像头占用（并集）</div>
    </div>
    <div class="stat">
      <div id="statCount" class="stat-value"></div>
      <div class="stat-label">当前筛选</div>
    </div>
    <div class="stat">
      <div id="statTotal" class="stat-value"></div>
      <div class="stat-label">按程序累计</div>
    </div>
  </div>

  <div class="tabs">
    <span id="tabSessions" class="tab active" onclick="switchTab('sessions')">会话明细</span>
    <span id="tabPrograms" class="tab" onclick="switchTab('programs')">按程序汇总</span>
  </div>

  <div class="table-area">
    <div id="sessionsPane" class="table-scroll">
      <table class="grid">
        <thead>
          <tr>
            <th>日期</th><th>开始</th><th>结束</th><th class="num">时长</th>
            <th>程序</th><th>设备</th><th>账户</th><th>路径</th>
          </tr>
        </thead>
        <tbody id="sessionsBody"></tbody>
      </table>
    </div>

    <div id="programsPane" class="table-scroll hidden">
      <table class="grid">
        <thead>
          <tr>
            <th>程序</th><th class="num">次数</th><th class="num">总时长</th><th class="num">平均每次</th><th class="num">最长一次</th><th>最近一次</th>
          </tr>
        </thead>
        <tbody id="programsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <div class="left">
      <button class="btn-text" onclick="exportCsv()">导出 CSV</button>
      <button class="btn-text danger" onclick="askClear()">清理日志</button>
    </div>
    <div class="right">
      <button class="btn-text" onclick="closeMenu()">关闭</button>
      <button class="btn-text danger" onclick="askExit()">退出程序</button>
    </div>
  </div>
</div>

<div id="settings" class="drawer-overlay">
  <div class="drawer">
    <div class="drawer-head">
      <div class="drawer-title">设置</div>
      <button class="icon-btn" onclick="closeSettings()">×</button>
    </div>
    <div class="drawer-body">
      <div class="section">
        <div class="section-title">占用提示方式</div>
        <label class="choice"><input type="radio" name="displayMode" value="appbutton"><span class="ind"></span>在任务栏左侧新增一个应用图标</label>
        <label class="choice"><input type="radio" name="displayMode" value="tray"><span class="ind"></span>改变托盘图标（全程只保留一个托盘图标）</label>
        <label class="choice"><input type="radio" name="displayMode" value="overlay"><span class="ind"></span>在右上角常显传屏码浮层</label>
      </div>

      <div class="section">
        <div class="section-title">提示条件</div>
        <label class="choice"><input type="radio" name="taskbarMode" value="any"><span class="ind"></span>任何应用占用摄像头都提示</label>
        <label class="choice"><input type="radio" name="taskbarMode" value="only"><span class="ind"></span>仅名单内应用占用时提示</label>
        <label class="choice"><input type="radio" name="taskbarMode" value="exclude"><span class="ind"></span>忽略名单内应用的占用（其他应用照常提示）</label>
        <div class="hint">显示条件的名单与日志无关；被忽略的应用仍会完整记录。</div>
      </div>

      <div class="section">
        <div class="section-title">名单</div>
        <div id="appList" class="checklist"></div>
        <div class="inline">
          <input id="manualApp" class="field" type="text" placeholder="手动添加，例如 WeChat.exe">
          <button class="btn outline" onclick="addManualApp()">添加</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">日志与安全</div>
        <label class="field-label">日志保留天数</label>
        <input id="retention" class="field short" type="number" min="1" max="3650">
        <label class="field-label">当前口令</label>
        <input id="curPwd" class="field" type="password" placeholder="修改口令时填写">
        <label class="field-label">新口令（至少 4 位）</label>
        <input id="newPwd" class="field" type="password">
        <label class="field-label">再次输入新口令</label>
        <input id="newPwd2" class="field" type="password">
      </div>
    </div>
    <div class="drawer-foot">
      <span id="settingsError" class="drawer-error"></span>
      <button class="btn-text" onclick="closeSettings()">取消</button>
      <button class="btn" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div id="confirm" class="overlay">
  <div class="sheet">
    <div id="confirmText" class="sheet-title">确定执行此操作？</div>
    <div class="sheet-actions">
      <button class="btn-text" onclick="closeConfirm()">取消</button>
      <button id="confirmOk" class="btn danger" onclick="">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var nowMs = new Date().getTime();
var MOCK = {
  version: "0.3.2.0",
  hasPassword: true,
  disguiseName: "Realtek 高清晰音频管理器",
  user: "CLASS01\\student",
  config: { displayMode: "tray", taskbarMode: "any", taskbarApps: [], retentionDays: 90, overlayText: "" },
  devices: ["Integrated Camera"],
  active: [],
  sessions: [
    { startMs: nowMs - 3600000, endMs: nowMs - 3000000, app: "微信", identity: "WeChat.exe", path: "C:\\Program Files\\Tencent\\WeChat\\WeChat.exe", device: "Integrated Camera", user: "CLASS01\\student", seconds: 600, note: "" },
    { startMs: nowMs - 7200000, endMs: nowMs - 6600000, app: "钉钉", identity: "DingTalk.exe", path: "C:\\Program Files\\DingTalk\\DingTalk.exe", device: "Integrated Camera", user: "CLASS01\\student", seconds: 600, note: "" },
    { startMs: nowMs - 90000000, endMs: nowMs - 89900000, app: "相机", identity: "Microsoft.WindowsCamera_8wekyb3d8bbwe", path: "", device: "Integrated Camera", user: "CLASS01\\student", seconds: 100, note: "" }
  ]
};

var MOCK_API = {
  GetBootstrap: function () { return JSON.stringify(MOCK); },
  GetDataVersion: function () { return "mock"; },
  GetLive: function () {
    return JSON.stringify({ active: [{ app: "微信", identity: "WeChat.exe", device: "Integrated Camera", seconds: 83 }] });
  },
  SaveSettings: function (json) { return "ok"; },
  VerifyPassword: function (pwd) { return pwd ? "ok" : "bad"; },
  SetPassword: function (cur, next) { return "ok"; },
  ExportCsv: function (filter) { return "cancel"; },
  ClearLogs: function () { return "ok"; },
  CloseMenu: function () {},
  ExitApp: function () {}
};

var hasBridge = false;
try { hasBridge = !!(window.external && window.external.GetBootstrap); } catch (e) { hasBridge = false; }
var isIE = /Trident\/|MSIE /.test(navigator.userAgent);
var useMock = !hasBridge && !isIE;
var api = useMock ? MOCK_API : window.external;
var boot = null;
var config = null;
var allSessions = [];
var devices = [];
var programList = [];
var hasPassword = true;
var liveTimer = null;
var dataTimer = null;
var lastDataVersion = null;
var currentRange = "today";
var confirmAction = null;

function byId(id) { return document.getElementById(id); }
function hasClass(el, name) { return (" " + el.className + " ").indexOf(" " + name + " ") >= 0; }
function addClass(el, name) { if (!hasClass(el, name)) el.className = (el.className + " " + name).replace(/^\s+|\s+$/g, ""); }
function removeClass(el, name) { el.className = (" " + el.className + " ").replace(" " + name + " ", " ").replace(/^\s+|\s+$/g, ""); }
function escapeHtml(value) {
  if (value === null || value === undefined) return "";
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function formatDate(ms) { var d = new Date(ms); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function formatTime(ms) { var d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }
function formatDateTime(ms) { return formatDate(ms) + " " + formatTime(ms); }
function formatDuration(seconds) {
  seconds = Math.max(0, Number(seconds) || 0);
  if (seconds < 60) return Math.round(seconds) + " 秒";
  var minutes = Math.floor(seconds / 60);
  var hours = Math.floor(minutes / 60);
  var days = Math.floor(hours / 24);
  if (days > 0) return days + " 天 " + (hours % 24) + " 小时 " + (minutes % 60) + " 分";
  if (hours > 0) return hours + " 小时 " + (minutes % 60) + " 分";
  return minutes + " 分钟";
}
function splitDuration(seconds) {
  seconds = Math.max(0, Math.round(Number(seconds) || 0));
  if (seconds < 60) return [seconds, "秒"];
  var minutes = Math.floor(seconds / 60);
  var hours = Math.floor(minutes / 60);
  var days = Math.floor(hours / 24);
  if (days > 0) return [days, "天 " + (hours % 24) + " 小时"];
  if (hours > 0) return [hours, "小时 " + (minutes % 60) + " 分"];
  return [minutes, "分钟"];
}
function renderStatDuration(id, seconds) {
  var parts = splitDuration(seconds);
  byId(id).innerHTML = '<span class="stat-num">' + parts[0] + '</span><span class="stat-unit">' + parts[1] + "</span>";
}
function renderStatCount(id, count) {
  byId(id).innerHTML = '<span class="stat-num">' + count + '</span><span class="stat-unit">次</span>';
}

function doLogin() {
  var p1 = byId("pwd").value;
  var p2 = byId("pwd2").value;
  var err = byId("loginError");
  err.innerHTML = "";
  if (!hasPassword) {
    if (p1.length < 4) { err.innerHTML = "口令至少 4 位"; return; }
    if (p1 !== p2) { err.innerHTML = "两次输入不一致"; return; }
    var r = api.SetPassword("", p1);
    if (r !== "ok") { err.innerHTML = escapeHtml(r); return; }
    hasPassword = true;
    enterApp();
  } else {
    if (!p1) { err.innerHTML = "请输入口令"; return; }
    var result = api.VerifyPassword(p1);
    if (result === "ok") enterApp();
    else err.innerHTML = "口令不正确";
  }
}

function enterApp() {
  byId("login").style.display = "none";
  byId("app").className = "";
  reloadData();
  updateLive();
  if (!liveTimer) liveTimer = setInterval(updateLive, 1000);
  if (!dataTimer) dataTimer = setInterval(refreshData, 3000);
}

function reloadData() {
  try { boot = JSON.parse(api.GetBootstrap()); }
  catch (e) { showToast("读取数据失败", true); return; }
  try { lastDataVersion = api.GetDataVersion(); } catch (e) { lastDataVersion = null; }
  config = boot.config || {};
  allSessions = boot.sessions || [];
  devices = boot.devices || [];
  hasPassword = !!boot.hasPassword;
  byId("ver").innerHTML = "v" + escapeHtml(boot.version || "");
  buildAppOptions();
  buildDeviceOptions();
  render();
}

// 实时刷新：只比对数据版本号，有变化才重新读取并渲染。
function refreshData() {
  var version;
  try { version = api.GetDataVersion(); } catch (e) { return; }
  if (version === lastDataVersion) return;
  var raw;
  try { raw = api.GetBootstrap(); } catch (e) { return; }
  var next;
  try { next = JSON.parse(raw); } catch (e) { return; }
  lastDataVersion = version;
  boot = next;
  config = boot.config || {};
  allSessions = boot.sessions || [];
  devices = boot.devices || [];
  hasPassword = !!boot.hasPassword;
  byId("ver").innerHTML = "v" + escapeHtml(boot.version || "");
  buildAppOptions();
  buildDeviceOptions();
  render();
}

function buildAppOptions() {
  var selected = byId("appFilter").value;
  var map = {};
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.identity) map[s.identity] = s.app || s.identity;
  }
  var manual = config.taskbarApps || [];
  for (i = 0; i < manual.length; i++) if (!map[manual[i]]) map[manual[i]] = manual[i];
  var identities = [];
  for (var key in map) if (Object.prototype.hasOwnProperty.call(map, key)) identities.push(key);
  identities.sort(function (a, b) { return (map[a] + a).localeCompare(map[b] + b); });
  var select = byId("appFilter");
  select.options.length = 0;
  select.options[0] = new Option("全部程序", "");
  for (i = 0; i < identities.length; i++) select.options[select.options.length] = new Option(map[identities[i]] + " (" + identities[i] + ")", identities[i]);
  select.value = selected && map[selected] ? selected : "";
}

function buildDeviceOptions() {
  var selected = byId("deviceFilter").value;
  var names = [];
  var i, j;
  for (i = 0; i < devices.length; i++) {
    var ok = true;
    for (j = 0; j < names.length; j++) if (names[j] === devices[i]) ok = false;
    if (ok && devices[i]) names.push(devices[i]);
  }
  names.sort();
  var select = byId("deviceFilter");
  select.options.length = 0;
  select.options[0] = new Option("全部设备", "");
  for (i = 0; i < names.length; i++) select.options[select.options.length] = new Option(names[i], names[i]);
  select.value = selected && names.indexOf(selected) >= 0 ? selected : "";
}

function setRange(value, el) {
  currentRange = value;
  var buttons = byId("rangeGroup").getElementsByTagName("button");
  for (var i = 0; i < buttons.length; i++) buttons[i].className = buttons[i] === el ? "range active" : "range";
  render();
}

function rangeStart() {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  if (currentRange === "today") return d.getTime();
  if (currentRange === "7") return d.getTime() - 6 * 86400000;
  if (currentRange === "30") return d.getTime() - 29 * 86400000;
  return 0;
}

function render() {
  var from = rangeStart();
  var appId = byId("appFilter").value;
  var device = byId("deviceFilter").value;
  var base = [];
  var filtered = [];
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.startMs < from) continue;
    if (device && s.device !== device) continue;
    base.push(s);
    if (!appId || s.identity === appId) filtered.push(s);
  }
  var total = 0;
  for (i = 0; i < filtered.length; i++) total += Number(filtered[i].seconds) || 0;
  renderStatDuration("statUnion", unionSeconds(base));
  renderStatCount("statCount", filtered.length);
  renderStatDuration("statTotal", total);
  renderSessions(filtered);
  renderPrograms(base);
}

function unionSeconds(list) {
  if (!list.length) return 0;
  var copy = list.slice(0);
  copy.sort(function (a, b) { return a.startMs - b.startMs; });
  var total = 0;
  var curStart = 0, curEnd = 0, started = false;
  for (var i = 0; i < copy.length; i++) {
    var s = copy[i].startMs;
    var e = copy[i].endMs ? copy[i].endMs : s + (Number(copy[i].seconds) || 0) * 1000;
    if (e < s) e = s;
    if (!started) { curStart = s; curEnd = e; started = true; }
    else if (s <= curEnd) { if (e > curEnd) curEnd = e; }
    else { total += (curEnd - curStart); curStart = s; curEnd = e; }
  }
  if (started) total += (curEnd - curStart);
  return Math.round(total / 1000);
}

function renderSessions(list) {
  var body = byId("sessionsBody");
  if (!list.length) {
    body.innerHTML = '<tr><td class="empty" colspan="8">当前筛选下还没有记录。换一个范围或程序看看。</td></tr>';
    return;
  }
  var copy = list.slice(0);
  copy.sort(function (a, b) { return b.startMs - a.startMs; });
  var html = [];
  for (var i = 0; i < copy.length; i++) {
    var s = copy[i];
    html.push("<tr>");
    html.push("<td>" + formatDate(s.startMs) + "</td>");
    html.push("<td>" + formatTime(s.startMs) + "</td>");
    html.push("<td>" + (s.endMs ? formatTime(s.endMs) : "") + "</td>");
    html.push('<td class="num">' + formatDuration(s.seconds) + "</td>");
    html.push('<td><span class="app-name">' + escapeHtml(s.app) + "</span></td>");
    html.push("<td>" + escapeHtml(s.device) + "</td>");
    html.push("<td>" + escapeHtml(s.user) + "</td>");
    html.push('<td class="path">' + escapeHtml(s.path) + "</td>");
    html.push("</tr>");
  }
  body.innerHTML = html.join("");
}

function renderPrograms(list) {
  var map = {};
  var i;
  for (i = 0; i < list.length; i++) {
    var s = list[i];
    var key = s.identity || "未知";
    if (!map[key]) map[key] = { identity: key, display: s.app || key, count: 0, total: 0, max: 0, last: 0 };
    var item = map[key];
    item.display = s.app || item.display;
    item.count++;
    item.total += Number(s.seconds) || 0;
    if (Number(s.seconds) > item.max) item.max = Number(s.seconds);
    if (s.startMs > item.last) item.last = s.startMs;
  }
  programList = [];
  for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) programList.push(map[k]);
  programList.sort(function (a, b) { return b.total - a.total; });

  var body = byId("programsBody");
  if (!programList.length) {
    body.innerHTML = '<tr><td class="empty" colspan="6">当前筛选下还没有记录。</td></tr>';
    return;
  }
  var html = [];
  for (i = 0; i < programList.length; i++) {
    var p = programList[i];
    html.push('<tr class="clickable" onclick="setAppByIndex(' + i + ')">');
    html.push('<td><span class="app-name">' + escapeHtml(p.display) + '</span><br><span class="identity">' + escapeHtml(p.identity) + "</span></td>");
    html.push('<td class="num">' + p.count + "</td>");
    html.push('<td class="num">' + formatDuration(p.total) + "</td>");
    html.push('<td class="num">' + formatDuration(p.count ? p.total / p.count : 0) + "</td>");
    html.push('<td class="num">' + formatDuration(p.max) + "</td>");
    html.push("<td>" + formatDateTime(p.last) + "</td>");
    html.push("</tr>");
  }
  body.innerHTML = html.join("");
}

function setAppByIndex(index) {
  if (!programList[index]) return;
  var select = byId("appFilter");
  select.value = programList[index].identity;
  if (select.value !== programList[index].identity) {
    select.options[select.options.length] = new Option(programList[index].display + " (" + programList[index].identity + ")", programList[index].identity);
    select.value = programList[index].identity;
  }
  render();
}

function switchTab(name) {
  var sessions = name === "sessions";
  byId("sessionsPane").className = sessions ? "table-scroll" : "table-scroll hidden";
  byId("programsPane").className = sessions ? "table-scroll hidden" : "table-scroll";
  byId("tabSessions").className = sessions ? "tab active" : "tab";
  byId("tabPrograms").className = sessions ? "tab" : "tab active";
}

function updateLive() {
  try {
    var live = JSON.parse(api.GetLive());
    var active = live.active || [];
    var bar = byId("live");
    var text = byId("liveText");
    var meta = byId("liveMeta");
    if (!active.length) {
      bar.className = "live-bar";
      text.innerHTML = "当前没有摄像头占用";
      meta.innerHTML = "";
      return;
    }
    var names = [];
    for (var i = 0; i < active.length; i++) names.push(escapeHtml(active[i].app));
    bar.className = "live-bar active";
    text.innerHTML = names.join("、") + " 正在使用摄像头";
    meta.innerHTML = active.length === 1 ? "已用 " + formatDuration(active[0].seconds) : active.length + " 个应用同时使用";
  } catch (e) {}
}

function showToast(message, isError) {
  var toast = byId("toast");
  toast.innerHTML = escapeHtml(message);
  toast.className = isError ? "toast show error" : "toast show";
  window.setTimeout(function () { toast.className = "toast"; }, 2600);
}

function openSettings() {
  if (!boot) return;
  var display = config.displayMode || "tray";
  var mode = config.taskbarMode || "any";
  setRadio("displayMode", display);
  setRadio("taskbarMode", mode);
  byId("retention").value = config.retentionDays || 90;
  byId("curPwd").value = "";
  byId("newPwd").value = "";
  byId("newPwd2").value = "";
  byId("settingsError").innerHTML = "";
  buildSettingsAppList();
  byId("settings").className = "drawer-overlay show";
}

function closeSettings() { byId("settings").className = "drawer-overlay"; }

function setRadio(name, value) {
  var inputs = document.getElementsByName(name);
  for (var i = 0; i < inputs.length; i++) inputs[i].checked = inputs[i].value === value;
}

function getRadio(name) {
  var inputs = document.getElementsByName(name);
  for (var i = 0; i < inputs.length; i++) if (inputs[i].checked) return inputs[i].value;
  return "";
}

function buildSettingsAppList() {
  var map = {};
  var i;
  for (i = 0; i < allSessions.length; i++) {
    var s = allSessions[i];
    if (s.identity) map[s.identity] = s.app || s.identity;
  }
  var apps = config.taskbarApps || [];
  for (i = 0; i < apps.length; i++) if (!map[apps[i]]) map[apps[i]] = apps[i];
  var keys = [];
  for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) keys.push(k);
  keys.sort(function (a, b) { return (map[a] + a).localeCompare(map[b] + b); });
  var html = [];
  if (!keys.length) html.push('<div class="hint">还没有检测到应用，可手动添加。</div>');
  for (i = 0; i < keys.length; i++) {
    var checked = false;
    for (var j = 0; j < apps.length; j++) if (apps[j] === keys[i]) checked = true;
    html.push('<label class="check-item"><input type="checkbox" value="' + escapeHtml(keys[i]) + '"' + (checked ? " checked" : "") + '><span class="ind"></span> ' + escapeHtml(map[keys[i]]) + " (" + escapeHtml(keys[i]) + ")</label>");
  }
  byId("appList").innerHTML = html.join("");
}

function addManualApp() {
  var input = byId("manualApp");
  var value = input.value.replace(/^\s+|\s+$/g, "");
  if (!value) return;
  var list = byId("appList");
  var inputs = list.getElementsByTagName("input");
  for (var i = 0; i < inputs.length; i++) {
    if (inputs[i].value === value) { inputs[i].checked = true; input.value = ""; return; }
  }
  var label = document.createElement("label");
  label.className = "check-item";
  var checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.value = value;
  checkbox.checked = true;
  label.appendChild(checkbox);
  var indicator = document.createElement("span");
  indicator.className = "ind";
  label.appendChild(indicator);
  label.appendChild(document.createTextNode(" " + value));
  list.appendChild(label);
  input.value = "";
}

function saveSettings() {
  var err = byId("settingsError");
  err.innerHTML = "";
  var retention = parseInt(byId("retention").value, 10);
  if (!(retention >= 1 && retention <= 3650)) { err.innerHTML = "日志保留天数需在 1–3650 之间"; return; }
  var apps = [];
  var inputs = byId("appList").getElementsByTagName("input");
  for (var i = 0; i < inputs.length; i++) if (inputs[i].checked && inputs[i].value) apps.push(inputs[i].value);
  var cfg = {
    displayMode: getRadio("displayMode"),
    taskbarMode: getRadio("taskbarMode"),
    taskbarApps: apps,
    retentionDays: retention,
    overlayText: config.overlayText || ""
  };
  var result = api.SaveSettings(JSON.stringify(cfg));
  if (result !== "ok") { err.innerHTML = escapeHtml(result || "保存失败"); return; }

  var cur = byId("curPwd").value;
  var next = byId("newPwd").value;
  var next2 = byId("newPwd2").value;
  if (cur || next || next2) {
    if (next.length < 4) { err.innerHTML = "新口令至少 4 位"; return; }
    if (next !== next2) { err.innerHTML = "两次输入不一致"; return; }
    var pwdResult = api.SetPassword(cur, next);
    if (pwdResult !== "ok") { err.innerHTML = escapeHtml(pwdResult); return; }
    hasPassword = true;
  }
  reloadData();
  closeSettings();
  showToast("设置已保存");
}

function exportCsv() {
  var filter = {
    fromMs: rangeStart(),
    toMs: 0,
    app: byId("appFilter").value,
    device: byId("deviceFilter").value
  };
  var result = api.ExportCsv(JSON.stringify(filter));
  if (result && result.indexOf("ok|") === 0) showToast("已导出：" + result.substring(3));
  else if (result !== "cancel") showToast(result || "导出失败", true);
}

function askClear() {
  showConfirm("确定清空全部使用日志？此操作不可恢复。", function () {
    var result = api.ClearLogs();
    if (result === "ok") { reloadData(); showToast("日志已清空"); }
    else showToast(result || "清理失败", true);
  });
}

function askExit() {
  showConfirm("确定退出监控程序？退出后将不再记录摄像头占用。", function () { api.ExitApp(); });
}

function showConfirm(text, action) {
  byId("confirmText").innerHTML = text;
  byId("confirmOk").onclick = function () { closeConfirm(); action(); };
  byId("confirm").className = "overlay show";
}

function closeConfirm() { byId("confirm").className = "overlay"; }

function closeMenu() { api.CloseMenu(); }

function init() {
  try { boot = JSON.parse(api.GetBootstrap()); }
  catch (e) {
    byId("loginError").innerHTML = "读取数据失败，请关闭后重试";
    return;
  }
  try { lastDataVersion = api.GetDataVersion(); } catch (e) { lastDataVersion = null; }
  config = boot.config || {};
  allSessions = boot.sessions || [];
  devices = boot.devices || [];
  hasPassword = !!boot.hasPassword;
  byId("ver").innerHTML = "v" + escapeHtml(boot.version || "");
  if (!hasPassword) {
    byId("loginSub").innerHTML = "首次使用，请设置管理口令";
    byId("pwd2").className = "field";
    byId("loginBtn").innerHTML = "设置并进入";
  } else {
    byId("loginSub").innerHTML = "请输入管理口令";
    byId("pwd2").className = "field hidden";
  }
  if (useMock) enterApp();
}

window.onload = init;
document.onkeydown = function (e) {
  e = e || window.event;
  if (e.keyCode === 13) {
    var target = e.target || e.srcElement;
    if (target && target.id === "pwd") doLogin();
  }
};
</script>
</body>
